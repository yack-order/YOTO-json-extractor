name: Safety verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install GUI system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install hashed dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile application
        run: python -m compileall -q YOTO.py archive_safety.py privacy.py login.py http_client.py tests
      - name: Run safety regressions
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Smoke test the real GUI without an account
        run: xvfb-run -a python tests/gui_smoke.py
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --require-hashes --disable-pip --strict
      - name: Audit verification tooling
        run: python -m pip_audit -r requirements-dev.txt --require-hashes --disable-pip --strict
